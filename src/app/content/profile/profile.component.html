<div class="container">

  <div class="sections">
    <div class="personal-info section">
      <h3>(1) Προσωπικά Στοιχεία</h3>

      <!-- Pink Panel - Προσωπικά Στοιχεία -->
      <div class="form-group">
        <label for="afm">ΑΦΜ:</label>
        <input type="text" id="afm" [(ngModel)]="userService.userInfo.afm" disabled="true">
      </div>
      <div class="form-group">
        <label for="legal_form">Νομική μορφή:</label>
        <input type="text" id="legal_form" [(ngModel)]="userService.userInfo.legal_form" disabled="true">
      </div>
      <div class="form-group">
        <label for="tax_office">ΔΟΥ:</label>
        <input type="text" id="tax_office" [(ngModel)]="userService.userInfo.tax_office" disabled="true">
      </div>
      <div class="form-group">
        <label for="fullName">Ονοματεπώνυμο:</label>
        <input type="text" id="fullName" [(ngModel)]="fullName" disabled="true">
      </div>
      <div class="form-group">
        <label for="father_name">Όνομα Πατρός:</label>
        <input type="text" id="father_name" [(ngModel)]="userService.userInfo.father_name" disabled="true">
      </div>
      <div class="form-group">
        <label for="dob">Ημ/νία Γέννησης:</label>
        <input type="text" id="dob" [(ngModel)]="userService.userInfo.dob" disabled="true">
      </div>
      <div class="form-group">
        <label for="adt">ΑΔΤ:</label>
        <input type="text" id="adt" [(ngModel)]="userService.userInfo.adt" disabled="true">
      </div>
      <div class="form-group">
        <label for="iban">Τραπεζικός Λογαριασμός:</label>
        <input type="text" id="iban" [(ngModel)]="userService.userInfo.iban" disabled="true">
      </div>
      <div class="form-group">
        <label for="bank">ΤΡΑΠΕΖΑ:</label>
        <input type="text" id="bank" [(ngModel)]="userService.userInfo.bank" disabled="true">
      </div>
    </div>


    <div class="contact-info section">
      <h3>(2) Στοιχεία Επικοινωνίας</h3>

      <!-- Green Panel - Στοιχεία Επικοινωνίας -->
      <div class="form-group">
        <label for="address">Διεύθυνση:</label>
        <input type="text" id="address" [(ngModel)]="userService.userInfo.address" disabled="true">
      </div>
      <div class="form-group">
        <label for="city">Πόλη:</label>
        <input type="text" id="city" [(ngModel)]="userService.userInfo.city" disabled="true">
      </div>
      <div class="form-group">
        <label for="postal_code">Τ.Κ.:</label>
        <input type="text" id="postal_code" [(ngModel)]="userService.userInfo.postal_code" disabled="true">
      </div>
      <div class="form-group">
        <label for="country">Χώρα:</label>
        <input type="text" id="country" [(ngModel)]="userService.userInfo.country" disabled="true">
      </div>
      <div class="form-group">
        <label for="telephone">Τηλ:</label>
        <input type="text" id="telephone" [(ngModel)]="userService.userInfo.telephone" disabled="true">
      </div>
      <div class="form-group">
        <label for="mobile">Κινητό:</label>
        <input type="text" id="mobile" [(ngModel)]="userService.userInfo.mobile" disabled="true">
      </div>
      <div class="form-group">
        <label for="email_1">email1:</label>
        <input type="text" id="email_1" [(ngModel)]="userService.userInfo.email_1" disabled="true">
      </div>
      <div class="form-group">
        <label for="email_2">email2:</label>
        <input type="text" id="email_2" [(ngModel)]="userService.userInfo.email_2" disabled="true">
      </div>
    </div>
  </div>

  <!-- <div class="notes-info section">
    <h3>Σημειώσεις</h3>

    <div class="large-textarea">
      <textarea
        rows="14"
        cols="200"
        pInputTextarea
        [(ngModel)]="userService.userInfo.notes"
        [disabled]="true">
      </textarea>
    </div>
  </div>   -->

</div>
