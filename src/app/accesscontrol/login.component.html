<div style="text-align: center">
  <img width="30%" src="../../assets/xenophonBIGnew.png">
</div>

<div class="login-container">
  <h2>Πληροφοριακό σύστημα Ξενοφών</h2>
  <form (ngSubmit)="onLogin()">
    <div>
      <label for="username">Όνομα χρήστη:</label>
      <input type="text" id="username" [(ngModel)]="username" name="username" required minlength="3">
    </div>
    <div>
      <label for="password">Κωδικός χρήστη:</label>
      <input type="password" id="password" [(ngModel)]="password" name="password" required minlength="3">
    </div>

    <p *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
     </p>

    <button type="submit" [disabled]="username.length < 3 || password.length < 3">
      Είσοδος
    </button>
  </form>
</div>
